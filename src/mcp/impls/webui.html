<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeatShell · 连接管理</title>
<style>
  :root {
    --bg: #0f1419; --panel: #161d24; --line: #26313c; --text: #d8e1e8;
    --muted: #8b9aa7; --accent: #4aa8ff; --danger: #ff6b6b; --ok: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .tag { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; }
  button { font: inherit; color: var(--text); background: #1f2a35; border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #3b4a58; background: #24313d; }
  button.primary { background: #1d4c7a; border-color: #2b6ba6; }
  button.primary:hover { background: #245c92; }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: #5a2b2b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; color: var(--text); background: #0d1218;
           border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .login { max-width: 440px; margin: 12vh auto; }
  .login h2 { margin: 0 0 6px; font-size: 18px; }
  .login p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  tr:hover td { background: #1a222b; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { padding: 4px 9px; font-size: 12px; margin-left: 6px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
  .pill.key { border-color: #3f4d5c; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 42px 10px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex;
                    align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow: auto; z-index: 20; }
  .modal { width: min(720px, 100%); }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px;
                  padding-top: 14px; border-top: 1px solid var(--line); }
  .hidden { display: none !important; }
  .notice { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
  .notice.ok { background: #10291c; border: 1px solid #1f5136; color: #b8f0cd; }
  .notice.err { background: #2a1616; border: 1px solid #5a2b2b; color: #ffc9c9; }
  .notice.warn { background: #2b2412; border: 1px solid #5c4a19; color: #ffe6a3; }
  .fingerprint { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
                 background: #0d1218; border: 1px solid #5c4a19; border-radius: 6px; padding: 8px; margin: 6px 0 10px; }
  .toast { position: fixed; right: 20px; bottom: 20px; background: #1f2a35; border: 1px solid var(--line);
           border-radius: 8px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 40; }
  .toast.err { border-color: #5a2b2b; color: #ffc9c9; }
  .toast.ok { border-color: #1f5136; }
  code { background: #0d1218; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>MeatShell</h1><span class="tag" id="tagline">连接管理</span>
  <span class="spacer"></span>
  <span class="tag hidden" id="identity"></span>
  <button class="ghost hidden" id="logout-btn">退出</button>
</header>

<main>
  <section class="card login hidden" id="login-view">
    <h2>登录</h2>
    <p>粘贴一个有效的访问令牌（MCP Bearer token）。令牌只用于换取浏览器会话，不会保存在页面里。</p>
    <div class="field">
      <label for="token">访问令牌</label>
      <textarea id="token" rows="3" class="mono" placeholder="eyJhbGciOiJSUzI1NiIs..."></textarea>
    </div>
    <div id="login-error" class="notice err hidden"></div>
    <button class="primary" id="login-btn">登录</button>
  </section>

  <section id="app-view" class="hidden">
    <div class="toolbar">
      <button class="primary" id="new-btn">＋ 新建连接</button>
      <input id="search" placeholder="搜索名称 / 主机 / 用户" style="max-width:280px">
      <select id="group-filter" style="max-width:180px"><option value="">全部分组</option></select>
      <span class="grow"></span>
      <span class="muted" id="count"></span>
      <button id="refresh-btn">刷新</button>
    </div>
    <div class="card" style="padding:0; overflow:hidden">
      <table>
        <thead>
          <tr><th>名称</th><th>地址</th><th>用户</th><th>认证</th><th>备注</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty hidden" id="empty">还没有连接，点“新建连接”开始。</div>
    </div>
  </section>
</main>

<!-- Editor -->
<div class="modal-backdrop hidden" id="editor-backdrop">
  <div class="card modal" role="dialog" aria-modal="true">
    <h2 id="editor-title">新建连接</h2>
    <div class="row">
      <div class="field"><label for="f-name">名称</label><input id="f-name" placeholder="留空则用主机名"></div>
      <div class="field"><label for="f-group">分组</label><input id="f-group" list="groups" placeholder="可选"></div>
    </div>
    <datalist id="groups"></datalist>
    <div class="row">
      <div class="field" style="flex:2"><label for="f-host">主机 *</label><input id="f-host" placeholder="192.168.8.10 或 host.example.com"></div>
      <div class="field" style="flex:0 0 110px"><label for="f-port">端口</label><input id="f-port" type="number" min="1" max="65535" value="22"></div>
    </div>
    <div class="row">
      <div class="field"><label for="f-user">用户</label><input id="f-user" placeholder="root"></div>
      <div class="field"><label for="f-auth">认证方式</label>
        <select id="f-auth">
          <option value="password">密码</option>
          <option value="keyboard-interactive">键盘交互（密码）</option>
          <option value="key">私钥</option>
        </select>
      </div>
    </div>

    <div id="password-fields">
      <div class="field"><label for="f-password">密码 <span class="muted" id="password-hint"></span></label>
        <input id="f-password" type="password" autocomplete="new-password">
      </div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px">
        <input type="checkbox" id="f-clear-password" style="width:auto"> 清除已保存的密码
      </label>
    </div>

    <div id="key-fields" class="hidden">
      <div class="field"><label for="f-key-path">私钥路径（容器内路径）</label>
        <input id="f-key-path" class="mono" placeholder="/keys/id_ed25519">
      </div>
      <div class="field"><label for="f-key-inline">或粘贴私钥内容 <span class="muted" id="key-hint"></span></label>
        <textarea id="f-key-inline" rows="4" class="mono" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="field"><label for="f-proxy">代理（可选）</label><input id="f-proxy" class="mono" placeholder="socks5://127.0.0.1:1080"></div>
      <div class="field"><label for="f-jump">跳板机（可选）</label><select id="f-jump"><option value="">直连</option></select></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:6px">
      <input type="checkbox" id="f-mcp" style="width:auto" checked> 允许 MCP 客户端使用这条连接
    </label>

    <div id="test-result"></div>

    <div class="modal-footer">
      <button class="ghost" id="cancel-btn">取消</button>
      <button id="test-btn">测试连接</button>
      <button class="primary" id="save-btn">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let sessions = [];
  let editingId = null;
  let me = null;

  const api = async (path, options = {}) => {
    const opts = { credentials: 'same-origin', ...options };
    opts.headers = { 'Content-Type': 'application/json', 'X-Ms-Web': '1', ...(options.headers || {}) };
    const res = await fetch(path, opts);
    if (res.status === 401) { showLogin(); throw new Error('请先登录'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  };

  const toast = (message, kind = '') => {
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  };

  const showLogin = () => {
    $('login-view').classList.remove('hidden');
    $('app-view').classList.add('hidden');
    $('logout-btn').classList.add('hidden');
    $('identity').classList.add('hidden');
  };

  const showApp = () => {
    $('login-view').classList.add('hidden');
    $('app-view').classList.remove('hidden');
    $('logout-btn').classList.remove('hidden');
    $('identity').classList.remove('hidden');
  };

  const pill = (text, cls = '') => `<span class="pill ${cls}">${text}</span>`;

  const render = () => {
    const query = $('search').value.trim().toLowerCase();
    const group = $('group-filter').value;
    const filtered = sessions.filter((s) => {
      const hay = `${s.name} ${s.host} ${s.user} ${s.group}`.toLowerCase();
      return (!query || hay.includes(query)) && (!group || s.group === group);
    });
    const rows = $('rows');
    rows.innerHTML = '';
    $('empty').classList.toggle('hidden', filtered.length > 0);
    $('count').textContent = `${filtered.length} / ${sessions.length} 条连接`;

    for (const s of filtered) {
      const tr = document.createElement('tr');
      const jump = s.jump_session_id ? pill('跳板') : '';
      const proxy = s.has_proxy ? pill('代理') : '';
      const hidden = s.mcp_access === false ? pill('MCP 关闭') : '';
      const authLabel = s.auth === 'key' ? '私钥' : (s.auth === 'keyboard-interactive' ? '键盘交互' : '密码');
      const secretMark = s.auth === 'key'
        ? (s.has_inline_key ? pill('内联密钥', 'key') : '')
        : (s.has_password ? pill('已存密码', 'key') : '');
      tr.innerHTML = `
        <td><strong>${escapeHtml(s.name)}</strong>${s.group ? `<span class="pill">${escapeHtml(s.group)}</span>` : ''}</td>
        <td class="mono">${escapeHtml(s.user ? s.user + '@' : '')}${escapeHtml(s.host)}:${s.port}</td>
        <td class="mono">${escapeHtml(s.user || '—')}</td>
        <td>${authLabel} ${secretMark}</td>
        <td>${jump}${proxy}${hidden}${s.kind !== 'ssh' ? pill(escapeHtml(s.kind)) : ''}</td>
        <td class="actions"></td>`;
      const actions = tr.querySelector('.actions');
      actions.append(
        button('测试', () => testSaved(s.id)),
        button('编辑', () => openEditor(s)),
        button('删除', () => removeSession(s), 'danger'),
      );
      rows.appendChild(tr);
    }

    const groups = [...new Set(sessions.map((s) => s.group).filter(Boolean))].sort();
    const filter = $('group-filter');
    const current = filter.value;
    filter.innerHTML = '<option value="">全部分组</option>' +
      groups.map((g) => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
    filter.value = groups.includes(current) ? current : '';
    $('groups').innerHTML = groups.map((g) => `<option value="${escapeHtml(g)}">`).join('');
  };

  const button = (label, onClick, cls = '') => {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.onclick = onClick;
    return b;
  };

  const escapeHtml = (value) => String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  const loadSessions = async () => {
    const data = await api('/api/sessions');
    sessions = data.sessions || [];
    render();
  };

  const openEditor = (session = null) => {
    editingId = session ? session.id : null;
    $('editor-title').textContent = session ? '编辑连接' : '新建连接';
    $('f-name').value = session?.name || '';
    $('f-group').value = session?.group || '';
    $('f-host').value = session?.host || '';
    $('f-port').value = session?.port || 22;
    $('f-user').value = session?.user || '';
    $('f-auth').value = session?.auth || 'password';
    $('f-password').value = '';
    $('f-clear-password').checked = false;
    $('f-password').placeholder = session?.has_password ? '已保存，留空则保持不变' : '';
    $('f-key-path').value = session?.private_key_path || '';
    $('f-key-inline').value = '';
    $('f-key-inline').placeholder = session?.has_inline_key
      ? '已保存内联私钥，留空则保持不变'
      : '-----BEGIN OPENSSH PRIVATE KEY-----';
    $('f-proxy').value = '';
    $('f-proxy').placeholder = session?.has_proxy ? '已配置（留空保持不变，输入 - 清除）' : 'socks5://127.0.0.1:1080';
    $('f-mcp').checked = session ? session.mcp_access !== false : true;
    const jump = $('f-jump');
    jump.innerHTML = '<option value="">直连</option>' + sessions
      .filter((s) => !session || s.id !== session.id)
      .map((s) => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name || s.host)}</option>`).join('');
    jump.value = session?.jump_session_id || '';
    $('test-result').innerHTML = '';
    syncAuthFields();
    $('editor-backdrop').classList.remove('hidden');
    $('f-host').focus();
  };

  const closeEditor = () => {
    $('editor-backdrop').classList.add('hidden');
    editingId = null;
  };

  const syncAuthFields = () => {
    const isKey = $('f-auth').value === 'key';
    $('key-fields').classList.toggle('hidden', !isKey);
    $('password-fields').classList.toggle('hidden', isKey);
  };

  const formPayload = () => {
    const payload = {
      name: $('f-name').value.trim(),
      group: $('f-group').value.trim(),
      host: $('f-host').value.trim(),
      port: Number($('f-port').value) || 22,
      user: $('f-user').value.trim(),
      auth: $('f-auth').value,
      private_key_path: $('f-key-path').value.trim(),
      mcp_access: $('f-mcp').checked,
      jump_session_id: $('f-jump').value,
      clear_password: $('f-clear-password').checked,
    };
    const password = $('f-password').value;
    if (password) payload.password = password;
    const key = $('f-key-inline').value.trim();
    if (key) payload.private_key_inline = key;
    const proxyValue = $('f-proxy').value.trim();
    if (proxyValue === '-') payload.proxy = '';
    else if (proxyValue) payload.proxy = proxyValue;
    return payload;
  };

  const save = async () => {
    const payload = formPayload();
    try {
      if (editingId) await api(`/api/sessions/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) });
      else await api('/api/sessions', { method: 'POST', body: JSON.stringify(payload) });
      toast('已保存', 'ok');
      closeEditor();
      await loadSessions();
    } catch (e) {
      toast(e.message, 'err');
    }
  };

  const removeSession = async (session) => {
    if (!confirm(`删除连接 “${session.name}”？此操作不可撤销。`)) return;
    try {
      await api(`/api/sessions/${session.id}`, { method: 'DELETE' });
      toast('已删除', 'ok');
      await loadSessions();
    } catch (e) {
      toast(e.message, 'err');
    }
  };

  const showTestResult = (result, retry) => {
    const box = $('test-result');
    if (result.status === 'ok') {
      box.innerHTML = '<div class="notice ok">连接成功：主机可达、主机密钥已信任、认证通过。</div>';
      return;
    }
    if (result.status === 'host_key_unknown') {
      const reason = result.changed
        ? '⚠ 主机密钥与已保存的不一致（可能是服务器重装，也可能是中间人攻击）。请通过服务器控制台核对指纹。'
        : '该主机的密钥尚未信任。请通过服务器控制台或管理员渠道核对下面的指纹。';
      box.innerHTML = `
        <div class="notice warn">
          ${escapeHtml(reason)}<br>
          主机：<span class="mono">${escapeHtml(result.host)}:${result.port}</span>　类型：<span class="mono">${escapeHtml(result.key_type)}</span>
          <div class="fingerprint">${escapeHtml(result.fingerprint)}</div>
          <button class="primary" id="trust-btn">指纹核对无误，信任并重试</button>
        </div>`;
      $('trust-btn').onclick = async () => {
        try {
          await api('/api/hostkeys/trust', {
            method: 'POST',
            body: JSON.stringify({ token: result.token }),
          });
          await retry();
        } catch (e) {
          toast(e.message, 'err');
        }
      };
      return;
    }
    if (result.status === 'missing_credentials') {
      const parts = [];
      if (result.need_user) parts.push('用户名');
      if (result.need_password) parts.push('密码');
      box.innerHTML = `<div class="notice err">缺少 ${escapeHtml(parts.join('、'))}。headless 服务无法弹框询问，请先把凭据保存到连接里。</div>`;
      return;
    }
    if (result.status === 'mfa_required') {
      box.innerHTML = `<div class="notice err">服务器要求二次验证（${escapeHtml(result.prompt)}），headless 服务无法交互输入，连接被拒绝。</div>`;
      return;
    }
    box.innerHTML = `<div class="notice err">连接失败：${escapeHtml(result.message || '未知错误')}</div>`;
  };

  const testDraft = async () => {
    const box = $('test-result');
    box.innerHTML = '<div class="notice">正在连接…</div>';
    try {
      const result = await api('/api/test', { method: 'POST', body: JSON.stringify(formPayload()) });
      showTestResult(result, testDraft);
    } catch (e) {
      box.innerHTML = `<div class="notice err">${escapeHtml(e.message)}</div>`;
    }
  };

  const testSaved = async (id) => {
    const session = sessions.find((s) => s.id === id);
    openEditor(session);
    $('test-result').innerHTML = '<div class="notice">正在连接…</div>';
    try {
      const result = await api(`/api/sessions/${id}/test`, { method: 'POST', body: '{}' });
      showTestResult(result, () => testSaved(id));
    } catch (e) {
      $('test-result').innerHTML = `<div class="notice err">${escapeHtml(e.message)}</div>`;
    }
  };

  const login = async () => {
    const token = $('token').value.trim();
    if (!token) return;
    $('login-error').classList.add('hidden');
    try {
      const data = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      }).then((r) => r.json().then((body) => ({ ok: r.ok, body })));
      if (!data.ok) throw new Error(data.body.error || '登录失败');
      $('token').value = '';
      await boot();
    } catch (e) {
      $('login-error').textContent = e.message;
      $('login-error').classList.remove('hidden');
    }
  };

  const boot = async () => {
    try {
      me = await api('/api/me');
      $('identity').textContent = `${me.subject} · v${me.version} · ${me.session_count} 条连接`;
      $('tagline').textContent = me.data_dir;
      showApp();
      await loadSessions();
    } catch (_) { /* showLogin already ran */ }
  };

  $('login-btn').onclick = login;
  $('token').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) login(); });
  $('logout-btn').onclick = async () => {
    await fetch('/api/logout', { method: 'POST', headers: { 'X-Ms-Web': '1' } }).catch(() => {});
    showLogin();
  };
  $('new-btn').onclick = () => openEditor();
  $('refresh-btn').onclick = () => loadSessions().catch((e) => toast(e.message, 'err'));
  $('search').oninput = render;
  $('group-filter').onchange = render;
  $('cancel-btn').onclick = closeEditor;
  $('save-btn').onclick = save;
  $('test-btn').onclick = testDraft;
  $('f-auth').onchange = syncAuthFields;
  $('editor-backdrop').addEventListener('click', (e) => { if (e.target === $('editor-backdrop')) closeEditor(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEditor(); });

  boot();
})();
</script>
</body>
</html>
